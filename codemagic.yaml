# Codemagic pipeline for LumaScan on iOS. See lumascan_app/docs/ios-testing-from-windows.md.
# Each run uses free macOS M2 minutes (500 a month on a personal account).
workflows:
  ios-tests:
    name: iOS tests and unsigned build
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: lumascan_app
    environment:
      flutter: 3.47.6
      xcode: latest
      cocoapods: default
    triggering:
      # Every pull request into the base branch, and again on each push to it.
      events:
        - pull_request
      branch_patterns:
        - pattern: feature/scan_save
          include: true
          source: false
      cancel_previous_builds: true
    scripts:
      - name: Get packages
        script: flutter pub get

      - name: Unit and widget tests
        # Golden screenshots are made on Linux and differ on macOS, so they are left out.
        script: |
          mkdir -p test-results
          flutter test --exclude-tags golden --machine > test-results/unit.json
        test_report: test-results/unit.json

      - name: Start-up test on the iOS simulator
        script: |
          flutter emulators --launch apple_ios_simulator
          flutter -d iPhone test --machine integration_test > test-results/ios-simulator.json
        test_report: test-results/ios-simulator.json

      - name: Build unsigned iOS app
        # Release mode, because an iOS debug build only starts with a debugger attached.
        script: |
          flutter build ios --release --no-codesign
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qry LumaScan-unsigned.ipa Payload
    # Artifact paths start at the repository root, not at working_directory.
    artifacts:
      - lumascan_app/build/ipa/LumaScan-unsigned.ipa
      - lumascan_app/test-results/*.json
