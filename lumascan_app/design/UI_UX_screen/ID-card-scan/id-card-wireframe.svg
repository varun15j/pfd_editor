<g transform="translate(70 140)"><use href="#panel"/><circle cx="30" cy="30" r="16" fill="#00945e"/><text x="23" y="34" class="no">01</text><text x="58" y="35" class="pt">Shortcuts</text><text x="58" y="55" class="ps">ID Card tile, Process Files and bottom navigation.</text><g transform="translate(22 78)"><use href="#phone"/><text x="95" y="45" font-size="17">Shortcuts</text><rect y="55" width="244" height="310" fill="#fafafa"/><text x="14" y="83" font-size="15">Scan</text><g transform="translate(13 96)"><rect width="62" height="72" fill="#eee"/><use href="#front" transform="translate(6 19) scale(.48)"/><text x="15" y="91" class="ui">ID Card</text></g><g transform="translate(90 96)"><rect width="62" height="72" fill="#eee"/><rect x="10" y="10" width="42" height="52" fill="#fff"/><text y="91" class="ui">Scan Docs</text></g><g transform="translate(167 96)"><rect width="62" height="72" fill="#eee"/><path d="M9 20q22-13 44 0v38q-22-13-44 0z" fill="#fff" stroke="#198c67"/><text x="15" y="91" class="ui">Book</text></g><text x="13" y="232" class="ui">QR Code</text><text x="102" y="232" class="ui">To Text</text><text x="14" y="276" font-size="14">Process Files</text><rect x="14" y="290" width="62" height="65" fill="#eee"/><rect x="90" y="290" width="62" height="65" fill="#eee"/><rect x="167" y="290" width="62" height="65" fill="#eee"/><text x="8" y="374" class="sm">Import Files</text><text x="93" y="374" class="sm">Collage Images</text><text x="171" y="374" class="sm">PDF Watermark</text><circle cx="122" cy="372" r="27" fill="#00945e"/></g><g transform="translate(294 105)"><text class="g" font-size="12" font-weight="700">PLACEMENT</text><text y="34" class="ps"><tspan x="0">ID Card is first Scan tile.</tspan><tspan x="0" dy="21">Tools is active in bottom nav.</tspan><tspan x="0" dy="21">Camera action stays centered.</tspan></text></g></g>

<!-- 02 -->
<g transform="translate(590 140)"><use href="#panel"/><circle cx="30" cy="30" r="16" fill="#00945e"/><text x="23" y="34" class="no">02</text><text x="58" y="35" class="pt">ID Card selected</text><text x="58" y="55" class="ps">Two-sided A4 preview and active middle template.</text><g transform="translate(22 78)"><use href="#phone"/><g transform="translate(7 20)"><use href="#topcam"/><rect y="42" width="230" height="210" fill="url(#cam)"/><g transform="translate(33 47)"><use href="#paper2"/><rect x="81" y="8" width="77" height="22" rx="11" fill="#666"/><text x="119" y="23" class="sm w" text-anchor="middle">A4 paper example</text></g><rect x="33" y="212" width="164" height="28" fill="#eee"/><text x="41" y="224" class="xs">A must-have feature! You can make a 2-sided e-copy of an</text><text x="41" y="234" class="xs">ID card in 1 min. 100% ready for printing.</text><rect x="37" y="247" width="156" height="42" rx="5" fill="#00945e"/><text x="115" y="274" class="w" font-size="17" text-anchor="middle">Make it now</text><g transform="translate(0 293)"><use href="#modes"/><rect x="67" y="1" width="54" height="29" fill="none" stroke="#00945e" stroke-width="3"/></g><rect y="336" width="230" height="58" fill="#000"/><text x="14" y="359" class="sm mut">To Text</text><text x="67" y="359" class="sm mut">Docs</text><rect x="101" y="345" width="51" height="20" rx="10" fill="#00945e"/><text x="110" y="359" class="sm w">ID Card</text><text x="172" y="359" class="sm mut">QR Code</text></g></g><g transform="translate(294 105)"><text class="g" font-size="12" font-weight="700">EXACT ORDER</text><text y="34" class="ps"><tspan x="0">A4 example → description</tspan><tspan x="0" dy="21">→ Make it now → templates</tspan><tspan x="0" dy="21">→ capture mode row.</tspan></text></g></g>

