<rect width="2200" height="1370" fill="url(#bg)"/><text x="70" y="64" class="h">ID Card scan — exact screenshot wireframe</text><text x="70" y="100" class="sub">The eight source states, button labels, toolbar order and control placement are reproduced; identity data is sanitized.</text>

