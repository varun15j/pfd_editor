<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="1320" viewBox="0 0 2800 1320" role="img" aria-labelledby="title desc">
  <title id="title">LumaScan camera capture modes</title><desc id="desc">Six iOS camera wireframes for Docs, Book, Text, OCR Doc, QR and Photo modes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7faf8"/><stop offset="1" stop-color="#e8f0ec"/></linearGradient>
    <linearGradient id="cam" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#665243"/><stop offset="1" stop-color="#252522"/></linearGradient>
    <filter id="s"><feDropShadow dy="18" stdDeviation="20" flood-color="#14372e" flood-opacity=".2"/></filter>
    <style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#142d28}.title{font-size:52px;font-weight:800}.sub{font-size:20px;fill:#687a74}.mode{font-size:22px;font-weight:800}.small{font-size:12px;fill:#d8ebe5}.label{font-size:10px;font-weight:800;fill:white}.hint{font-size:11px;font-weight:750;fill:white}.teal{fill:#70ead2}.phone{fill:#15352d}.screen{fill:url(#cam)}.chip{fill:#0d1b18;fill-opacity:.84}.guide{fill:none;stroke:#70ead2;stroke-width:3}</style>
    <g id="shell"><rect width="390" height="790" rx="48" class="phone" filter="url(#s)"/><rect x="8" y="8" width="374" height="774" rx="41" class="screen"/><rect x="143" y="17" width="104" height="26" rx="14" fill="#15352d"/><text x="30" y="36" class="label">9:41</text><text x="335" y="36" class="label">●●● ᯤ ▰</text><rect x="28" y="75" width="78" height="39" rx="13" class="chip"/><text x="67" y="99" text-anchor="middle" class="label">▣ Batch</text><rect x="113" y="75" width="78" height="39" rx="13" class="chip"/><text x="152" y="99" text-anchor="middle" class="label">⚡ Flash</text><rect x="198" y="75" width="78" height="39" rx="13" class="chip"/><text x="237" y="99" text-anchor="middle" class="label">◎ Auto</text><rect x="306" y="75" width="45" height="39" rx="19" class="chip"/><text x="328" y="99" text-anchor="middle" class="label">•••</text><path d="M73 158L315 143l17 391L55 551z" fill="#fffdf7" opacity=".92"/><rect x="103" y="194" width="172" height="10" rx="5" fill="#899992"/><rect x="103" y="220" width="190" height="6" rx="3" fill="#c4ceca"/><rect x="103" y="241" width="171" height="6" rx="3" fill="#d0d7d4"/><rect x="103" y="282" width="188" height="126" rx="7" fill="#dce3df"/><rect x="25" y="650" width="340" height="42" rx="21" class="chip"/><circle cx="195" cy="735" r="38" fill="none" stroke="white" stroke-width="6"/><rect x="27" y="708" width="54" height="54" rx="14" fill="white"/><circle cx="337" cy="735" r="27" fill="#71262e"/><text x="337" y="743" text-anchor="middle" font-size="25" fill="white">×</text></g>
  </defs>
  <rect width="2800" height="1320" fill="url(#bg)"/><text x="100" y="100" class="title">Capture the right thing, the right way.</text><text x="100" y="143" class="sub">Six modes share one camera, but each provides focused guidance and processing.</text>

  <g transform="translate(85 225)"><text x="195" y="-28" text-anchor="middle" class="mode">Docs</text><use href="#shell"/><rect x="81" y="130" width="228" height="36" rx="18" class="chip"/><text x="195" y="153" text-anchor="middle" class="hint">Hold steady</text><path d="M73 158L315 143l17 391L55 551z" class="guide"/><text x="195" y="677" text-anchor="middle" class="label">Docs · Book · Text · OCR · QR · Photo</text><text x="195" y="830" text-anchor="middle" class="sub">Auto edges · multipage</text></g>
  <g transform="translate(535 225)"><text x="195" y="-28" text-anchor="middle" class="mode">Book</text><use href="#shell"/><rect x="81" y="130" width="228" height="36" rx="18" class="chip"/><text x="195" y="153" text-anchor="middle" class="hint">Align the book spine</text><rect x="45" y="177" width="300" height="348" rx="14" class="guide"/><line x1="195" y1="177" x2="195" y2="525" stroke="#70ead2" stroke-width="4"/><text x="118" y="201" text-anchor="middle" class="label">LEFT PAGE</text><text x="270" y="201" text-anchor="middle" class="label">RIGHT PAGE</text><text x="195" y="677" text-anchor="middle" class="label">Docs · Book · Text · OCR · QR · Photo</text><text x="195" y="830" text-anchor="middle" class="sub">Paired pages · layout preserved</text></g>
  <g transform="translate(985 225)"><text x="195" y="-28" text-anchor="middle" class="mode">Text</text><use href="#shell"/><rect x="81" y="130" width="228" height="36" rx="18" class="chip"/><text x="195" y="153" text-anchor="middle" class="hint">Point at text to recognize</text><rect x="92" y="210" width="205" height="31" rx="5" class="guide"/><rect x="104" y="264" width="181" height="31" rx="5" class="guide"/><rect x="87" y="319" width="218" height="31" rx="5" class="guide"/><rect x="210" y="484" width="110" height="31" rx="9" fill="#0b7065"/><text x="265" y="504" text-anchor="middle" class="label">LIVE TEXT</text><text x="195" y="677" text-anchor="middle" class="label">Docs · Book · Text · OCR · QR · Photo</text><text x="195" y="830" text-anchor="middle" class="sub">Live highlight · tap · copy</text></g>
  <g transform="translate(1435 225)"><text x="195" y="-28" text-anchor="middle" class="mode">OCR Doc</text><use href="#shell"/><rect x="81" y="130" width="228" height="36" rx="18" class="chip"/><text x="195" y="153" text-anchor="middle" class="hint">Fill the frame with the page</text><path d="M73 158L315 143l17 391L55 551z" class="guide"/><rect x="74" y="487" width="242" height="45" rx="12" fill="#0d1b18" fill-opacity=".9"/><text x="195" y="515" text-anchor="middle" class="label">OCR · IMAGE + SEARCHABLE TEXT</text><text x="195" y="677" text-anchor="middle" class="label">Docs · Book · Text · OCR · QR · Photo</text><text x="195" y="830" text-anchor="middle" class="sub">Accurate OCR · layout mapped</text></g>
  <g transform="translate(1885 225)"><text x="195" y="-28" text-anchor="middle" class="mode">QR</text><use href="#shell"/><rect x="81" y="130" width="228" height="36" rx="18" class="chip"/><text x="195" y="153" text-anchor="middle" class="hint">Place QR code in the frame</text><rect x="99" y="236" width="192" height="192" rx="24" class="guide" stroke-width="5"/><path d="M126 265h48v48h-48zM216 265h48v48h-48zM126 354h48v48h-48zM204 342h24v24h-24zM240 365h24v37h-24z" fill="#193a32"/><rect x="140" y="449" width="110" height="31" rx="9" fill="#0b7065"/><text x="195" y="469" text-anchor="middle" class="label">QR DETECTED</text><text x="195" y="677" text-anchor="middle" class="label">Docs · Book · Text · OCR · QR · Photo</text><text x="195" y="830" text-anchor="middle" class="sub">Preview payload · confirm action</text></g>
  <g transform="translate(2335 225)"><text x="195" y="-28" text-anchor="middle" class="mode">Photo</text><use href="#shell"/><rect x="81" y="130" width="228" height="36" rx="18" class="chip"/><text x="195" y="153" text-anchor="middle" class="hint">Compose your photo</text><circle cx="265" cy="268" r="38" fill="#e5ba6c"/><path d="M73 448l75-102 56 57 44-52 84 97" fill="none" stroke="#628c80" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><text x="195" y="677" text-anchor="middle" class="label">Docs · Book · Text · OCR · QR · Photo</text><text x="195" y="830" text-anchor="middle" class="sub">Natural photo · no page warp</text></g>
  <text x="100" y="1190" class="sub">Book retains the original spread and creates paired pages. Text is live and fast. OCR Doc is full-resolution and accuracy-first. QR never executes a payload without confirmation.</text>
  <text x="100" y="1235" class="sub">Implementation and formulas: docs/capture-modes-algorithms.md</text>
</svg>
