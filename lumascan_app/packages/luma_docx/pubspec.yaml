name: luma_docx
description: Reads, renders and writes Word (.docx) files in pure Dart and Flutter. No native code and no network.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.1
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.3.0
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
