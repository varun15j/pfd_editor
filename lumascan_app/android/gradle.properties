org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kept off: the Pub cache is on C: and the project on F:, and incremental
# Kotlin fails with "this and base files have different roots" when sources
# sit on two drives (seen 2026-11-02 building for BlueStacks). Turn it on only
# with the Pub cache on the project's drive (PUB_CACHE=F:\pub-cache).
kotlin.incremental=false
# Build performance: this PC is a 4-core / 8-thread i7 with 32 GB RAM.
# Run independent module tasks in parallel and cap workers at the 8 logical threads.
org.gradle.parallel=true
org.gradle.workers.max=8
# Reuse task outputs across builds and keep the daemon warm between runs.
org.gradle.caching=true
org.gradle.daemon=true
# Give the separate Kotlin compile daemon its own heap so it does not starve.
kotlin.daemon.jvmargs=-Xmx2G
