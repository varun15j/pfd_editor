org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Plugin sources live in the Pub cache on C:, while this project is on D:.
# Kotlin's incremental path cache cannot relativize files across Windows drives.
kotlin.incremental=false
# Build performance: this PC is a 4-core / 8-thread i7 with 32 GB RAM.
# Run independent module tasks in parallel and cap workers at the 8 logical threads.
org.gradle.parallel=true
org.gradle.workers.max=8
# Reuse task outputs across builds and keep the daemon warm between runs.
org.gradle.caching=true
org.gradle.daemon=true
# Give the separate Kotlin compile daemon its own heap so it does not starve.
kotlin.daemon.jvmargs=-Xmx2G
