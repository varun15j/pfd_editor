org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Recompile only the Kotlin that changed (much faster warm builds). It was
# off while the project was on D: and the Pub cache on C:. If a build fails
# with "different roots" (files on two drives), set it back to false or move
# the Pub cache to the project's drive (PUB_CACHE=F:\pub-cache).
kotlin.incremental=true
# Build performance: this PC is a 4-core / 8-thread i7 with 32 GB RAM.
# Run independent module tasks in parallel and cap workers at the 8 logical threads.
org.gradle.parallel=true
org.gradle.workers.max=8
# Reuse task outputs across builds and keep the daemon warm between runs.
org.gradle.caching=true
org.gradle.daemon=true
# Give the separate Kotlin compile daemon its own heap so it does not starve.
kotlin.daemon.jvmargs=-Xmx2G
